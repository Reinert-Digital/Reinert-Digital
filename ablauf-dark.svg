<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="230" viewBox="0 0 1280 230" role="img" aria-label="Ablauf: 1 Erstgespräch, 30 Minuten, kostenlos. 2 Angebot, Festpreis in 3 Werktagen. 3 Entwicklung mit wöchentlichen Updates. 4 Launch mit Hosting und Betreuung." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
 .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
 .track{stroke-dasharray:980;animation:draw 2.4s cubic-bezier(.65,0,.35,1) .3s both}
 .n{animation:pop .5s cubic-bezier(.22,1,.36,1) both}
 @keyframes draw{from{stroke-dashoffset:980}to{stroke-dashoffset:0}}
 @keyframes pop{from{opacity:.25}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1280" height="230" rx="18" fill="#0d1117"/>
<line x1="150" y1="84" x2="1128" y2="84" stroke="#f0f6fc" stroke-opacity=".14" stroke-width="2"/>
<line class="track" x1="150" y1="84" x2="1128" y2="84" stroke="#5aa2f0" stroke-width="3" stroke-linecap="round"/>
<g class="n" style="animation-delay:0.30s">
 <circle cx="150" cy="84" r="26" fill="#0d1117" stroke="#5aa2f0" stroke-width="2.5"/>
 <text class="t" x="150" y="92" text-anchor="middle" font-size="21" font-weight="800" fill="#5aa2f0">1</text>
 <text class="t" x="150" y="150" text-anchor="middle" font-size="21" font-weight="700" fill="#f0f6fc">Erstgespräch</text>
 <text class="t" x="150" y="180" text-anchor="middle" font-size="16" fill="#9198a1">30 Minuten, kostenlos</text>
</g>
<g class="n" style="animation-delay:1.05s">
 <circle cx="476" cy="84" r="26" fill="#0d1117" stroke="#5aa2f0" stroke-width="2.5"/>
 <text class="t" x="476" y="92" text-anchor="middle" font-size="21" font-weight="800" fill="#5aa2f0">2</text>
 <text class="t" x="476" y="150" text-anchor="middle" font-size="21" font-weight="700" fill="#f0f6fc">Angebot</text>
 <text class="t" x="476" y="180" text-anchor="middle" font-size="16" fill="#9198a1">Festpreis in 3 Werktagen</text>
</g>
<g class="n" style="animation-delay:1.80s">
 <circle cx="802" cy="84" r="26" fill="#0d1117" stroke="#5aa2f0" stroke-width="2.5"/>
 <text class="t" x="802" y="92" text-anchor="middle" font-size="21" font-weight="800" fill="#5aa2f0">3</text>
 <text class="t" x="802" y="150" text-anchor="middle" font-size="21" font-weight="700" fill="#f0f6fc">Entwicklung</text>
 <text class="t" x="802" y="180" text-anchor="middle" font-size="16" fill="#9198a1">Wöchentliche Updates</text>
</g>
<g class="n" style="animation-delay:2.55s">
 <circle cx="1128" cy="84" r="26" fill="#0d1117" stroke="#5aa2f0" stroke-width="2.5"/>
 <text class="t" x="1128" y="92" text-anchor="middle" font-size="21" font-weight="800" fill="#5aa2f0">4</text>
 <text class="t" x="1128" y="150" text-anchor="middle" font-size="21" font-weight="700" fill="#f0f6fc">Launch</text>
 <text class="t" x="1128" y="180" text-anchor="middle" font-size="16" fill="#9198a1">Hosting und Betreuung</text>
</g>
</svg>
