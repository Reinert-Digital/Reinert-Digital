<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Reinert Digital Solutions. Websites und Software, die liefern. Web- und Software-Studio aus Düsseldorf, Festpreis, Hosting in Deutschland." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .up{animation:up .9s cubic-bezier(.22,1,.36,1) both}
  .c1{animation:card .8s cubic-bezier(.22,1,.36,1) .9s both}
  .c2{animation:card .8s cubic-bezier(.22,1,.36,1) 1.05s both}
  .c3{animation:card .8s cubic-bezier(.22,1,.36,1) 1.2s both}
  .d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
  .line{stroke-dasharray:420;animation:draw 1.1s cubic-bezier(.65,0,.35,1) .7s both}
  @keyframes up{from{opacity:0;transform:translateY(10px)}}
  @keyframes card{from{opacity:0;transform:translate(36px,0)}}
  @keyframes draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <radialGradient id="g" cx="0.85" cy="0.15" r="0.6"><stop offset="0" stop-color="#5aa2f0" stop-opacity=".26"/><stop offset="1" stop-color="#5aa2f0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="340" rx="18" fill="#0d1117"/>
<rect width="1280" height="340" rx="18" fill="url(#g)"/>
<rect x=".5" y=".5" width="1279" height="339" rx="17.5" fill="none" stroke="#f0f6fc" stroke-opacity=".1"/>
<g class="t">
  <text class="up d1" x="72" y="96" font-size="15" font-weight="600" fill="#f0f6fc" fill-opacity=".62" letter-spacing="2.2">WEB- UND SOFTWARE-STUDIO · DÜSSELDORF</text>
  <text class="up d2" x="70" y="166" font-size="52" font-weight="800" fill="#f0f6fc" letter-spacing="-1.2">Reinert Digital Solutions</text>
  <path class="line" d="M72 186 H492" stroke="#5aa2f0" stroke-width="3" stroke-linecap="round" fill="none"/>
  <text class="up d3" x="72" y="230" font-size="25" fill="#f0f6fc" fill-opacity=".78">Websites und Software, die liefern.</text>
  <text class="up d3" x="72" y="282" font-size="15" font-weight="700" fill="#5aa2f0" letter-spacing="1.6">FESTPREIS  ·  DIREKT MIT DEM ENTWICKLER  ·  HOSTING IN DEUTSCHLAND</text>
</g>
<g class="t" font-size="15" font-weight="700" letter-spacing="1.4">
  <g class="c3"><rect x="905" y="214" width="290" height="62" rx="12" fill="#f0f6fc" fill-opacity=".05" stroke="#f0f6fc" stroke-opacity=".2"/><text x="929" y="251" fill="#f0f6fc" fill-opacity=".7">WEBSITE</text></g>
  <g class="c2"><rect x="927" y="146" width="290" height="62" rx="12" fill="#f0f6fc" fill-opacity=".08" stroke="#f0f6fc" stroke-opacity=".28"/><text x="951" y="183" fill="#f0f6fc" fill-opacity=".85">WEB-APP</text></g>
  <g class="c1"><rect x="949" y="78" width="290" height="62" rx="12" fill="#5aa2f0" fill-opacity=".16" stroke="#5aa2f0" stroke-opacity=".85"/><text x="973" y="115" fill="#5aa2f0">KI-INTEGRATION</text></g>
